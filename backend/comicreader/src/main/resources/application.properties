spring.application.name=comicreader

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/comicreader}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=300MB

comic.upload-dir=${COMIC_UPLOAD_DIR:uploads}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.otp.expiry-minutes=10
app.otp.resend-seconds=60
app.otp.max-attempts=5
app.otp.pepper=${OTP_PEPPER:change-this-in-production}
